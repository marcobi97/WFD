<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <title>WFD 学习中心</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f3ec;color:#20231f;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%)}.eyebrow{color:#26745f;font-size:14px;font-weight:750;letter-spacing:.08em}.title{font-size:clamp(34px,8vw,56px);line-height:1.05;margin:12px 0}.sub{color:#6d716b;font-size:17px;line-height:1.65;margin:0 0 30px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #ddd8ce;border-radius:24px;padding:26px;box-shadow:0 12px 32px rgba(45,48,43,.08);transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(45,48,43,.12)}
    .icon{font-size:34px}.card h2{font-size:24px;margin:18px 0 8px}.card p{color:#747870;line-height:1.55;margin:0}.reading{border-top:5px solid #24745f}.dictation{border-top:5px solid #315f78}.tip{font-size:13px;color:#8a8d87;text-align:center;margin-top:24px}@media(max-width:580px){.grid{grid-template-columns:1fr}.card{padding:22px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">WFD · 189 SENTENCES</div>
    <h1 class="title">选择学习模式</h1>
    <p class="sub">阅读版与听写训练共用 P1～P9 Markdown 题库。修改一次，两边同步更新。</p>
    <div class="grid">
      <a class="card reading" href="./reading.html">
        <div class="icon">Aa</div><h2>移动阅读版</h2><p>查看中文、彩色意群、英式音标与固定搭配。</p>
      </a>
      <a class="card dictation" href="./dictation.html">
        <div class="icon">▶</div><h2>听写训练</h2><p>播放句子、输入答案、检查错词并记录练习位置。</p>
      </a>
    </div>
    <div class="tip">题库来源：data/P1.md ～ data/P9.md</div>
  </main>
</body>
</html>
